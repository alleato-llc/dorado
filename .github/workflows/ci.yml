name: CI

on:
  push:
  pull_request:

# Least privilege by default; the audit job widens its own token below.
permissions:
  contents: read

# Supersede in-flight runs for the same ref (a new push cancels the old run).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which components changed, so each job below runs only when relevant. A
  # change to the wire-format spec (docs/spec.md) or to this workflow re-runs the
  # cross-compat suites everywhere, preserving the byte-for-byte invariant across
  # ports. Pure docs/changelog changes match nothing and run no build jobs.
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      go: ${{ steps.filter.outputs.go }}
      java: ${{ steps.filter.outputs.java }}
      python: ${{ steps.filter.outputs.python }}
      c: ${{ steps.filter.outputs.c }}
      zig: ${{ steps.filter.outputs.zig }}
      haskell: ${{ steps.filter.outputs.haskell }}
      cpp: ${{ steps.filter.outputs.cpp }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            spec: &spec
              - 'docs/spec.md'
              - '.github/workflows/ci.yml'
            rust:
              - *spec
              - 'rust/**'
            go:
              - *spec
              - 'go/**'
            java:
              - *spec
              - 'java/**'
            python:
              - *spec
              - 'python/**'
            c:
              - *spec
              - 'c/**'
            zig:
              - *spec
              - 'zig/**'
            haskell:
              - *spec
              - 'haskell/**'
            cpp:
              - *spec
              - 'cpp/**'
            web:
              - '.github/workflows/ci.yml'
              - 'web/**'

  # Format, lint, and test the cipher and construction crates plus the CLIs.
  # These need no system libraries. The Rust workspace lives in rust/. The GUI
  # crates (dorado-gui, dorado-gui-kit, dorado-gyotaku-gui) are excluded from
  # this workspace (see rust/Cargo.toml) precisely so this job never needs the
  # sibling `rime` checkout the GUIs depend on; see the `gui` job below.
  core:
    name: Rust core (fmt, clippy, test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Exercise the optional RustCrypto trait impls (cipher + digest).
      - run: cargo test -p dorado --all-features
      # Make sure the benchmarks keep compiling (do not run them in CI).
      - run: cargo bench -p dorado --no-run

  # The GUIs pull in a graphics stack and need windowing system libraries to
  # build, so they get their own job with those installed (build/lint only).
  # They also depend on the sibling `rime` component kit by path
  # (github.com/alleato-llc/rime, public), so `dorado` and `rime` are checked
  # out as siblings, matching each GUI crate's `../../../../rime/rime` path
  # dependency. Each of the three GUI-related crates (dorado-gui,
  # dorado-gui-kit, dorado-gyotaku-gui) is excluded from the main workspace
  # (rust/Cargo.toml) and resolves its own separate Cargo.lock, so each is
  # linted from its own directory rather than via `-p` from a shared workspace.
  gui:
    name: Rust GUIs (build + clippy)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: dorado }
      - uses: actions/checkout@v4
        with: { repository: alleato-llc/rime, path: rime } # public sibling; dorado-gui(-kit)/dorado-gyotaku-gui depend on it by ../../../../rime/rime
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Clippy dorado-gui-kit
        working-directory: dorado/rust/crates/dorado-gui-kit
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy dorado-gui
        working-directory: dorado/rust/crates/dorado-gui
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy dorado-gyotaku-gui
        working-directory: dorado/rust/crates/dorado-gyotaku-gui
        run: cargo clippy --all-targets -- -D warnings

  # Prove the cipher library builds without std on a bare-metal target, at both
  # levels: with an allocator (default) and fully allocation-free
  # (--no-default-features). If anything leaks std, or alloc into the no-alloc
  # build, these fail to compile.
  nostd:
    name: Rust no_std / no-alloc
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - run: cargo build -p dorado --target thumbv7em-none-eabi
      - run: cargo build -p dorado --no-default-features --target thumbv7em-none-eabi

  # Check dependencies against the RustSec advisory database.
  audit:
    name: Rust security audit (RustSec)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # audit-check opens an issue when an advisory lands on the default branch.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: rust

  # Vet, build, and test the Go port (which must match the Rust on-disk format).
  go:
    name: Go port
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Build and test the Java SDK (which must match the Rust on-disk format). Its
  # cross-compat tests decrypt fixtures made by the Rust CLI, committed in the repo.
  java:
    name: Java port
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew test --no-daemon

  # Test the Python port (SDK + CLIs). Cross-compat tests decrypt fixtures made by
  # the Rust CLI, committed in the repo.
  python:
    name: Python port
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # Build and test the C port (SDK + CLIs). Argon2 from libargon2, scrypt/PBKDF2/
  # HMAC from OpenSSL, both via pkg-config. Cross-compat tests decrypt fixtures
  # made by the Rust CLI, committed in the repo.
  c:
    name: C port
    needs: changes
    if: needs.changes.outputs.c == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: c
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libargon2-dev libssl-dev pkg-config
      - run: make
      - run: make test
      - run: make test SAN=1     # rerun the suite under AddressSanitizer + UndefinedBehaviorSanitizer
      - run: make freestanding   # the primitives build with no OS / allocator

  # Build and test the Zig port (SDK + CLIs). No external libraries: the KDFs come
  # from Zig's standard library. Cross-compat tests decrypt fixtures made by the
  # Rust CLI, committed in the repo.
  zig:
    name: Zig port
    needs: changes
    if: needs.changes.outputs.zig == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zig
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: "0.16.0"
      - run: zig build
      - run: zig build test
      - run: zig build freestanding   # the primitives cross-compile to bare-metal ARM

  # Build and test the Haskell port (SDK + CLIs). KDFs via crypton (fetched by
  # cabal); the suite's cross-compat tests decrypt fixtures made by the Rust CLI,
  # committed in the repo. GHC 9.14 matches the toolchain the port is developed on.
  haskell:
    name: Haskell port
    needs: changes
    if: needs.changes.outputs.haskell == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: haskell
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.14.1"
          cabal-version: "latest"
      - run: cabal build all
      - run: cabal test

  # Build and test the C++ port (SDK + CLIs). The KDFs (Argon2id/scrypt/PBKDF2) are
  # delegated to OpenSSL's EVP_KDF; Argon2 needs OpenSSL >= 3.2, which Ubuntu's system
  # OpenSSL (3.0) lacks, so this runs in a Fedora container that ships OpenSSL 3.2+ and
  # a C++23 compiler. Cross-compat tests decrypt fixtures made by the Rust CLI.
  cpp:
    name: C++ port
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-latest
    container: fedora:41
    defaults:
      run:
        working-directory: cpp
    steps:
      # Runs before checkout (so cpp/ does not exist yet) and installs git for it.
      # libasan/libubsan are the GCC sanitizer runtimes for the -DSANITIZE=ON
      # build below; without them its executables fail to link.
      - run: dnf install -y gcc-c++ cmake openssl-devel git libasan libubsan
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v4
      - run: cmake -S . -B build
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: cmake -S . -B build-san -DSANITIZE=ON
      - run: cmake --build build-san
      - run: ctest --test-dir build-san --output-on-failure   # rerun the suite under AddressSanitizer + UndefinedBehaviorSanitizer

  # Build the landing page in web/ so a broken site fails CI.
  web:
    name: Web landing page (build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
