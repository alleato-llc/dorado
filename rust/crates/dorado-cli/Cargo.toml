[package]
name = "dorado-cli"
description = "Command-line frontend for dorado (educational, unaudited)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dorado"
path = "src/main.rs"

[dependencies]
dorado-engine = { path = "../dorado-engine" }
clap = { version = "4", features = ["derive"] }
# No-echo interactive password prompt.
rpassword = "7"
# Wipe passwords and raw keys from memory.
zeroize = "1"
# Lock the password buffer into RAM (out of swap). Safe API, so the crate keeps
# #![forbid(unsafe_code)].
region = "3"

# Suppress core dumps (RLIMIT_CORE = 0) so a crash cannot spill the password or
# derived keys to a core file; `mlock` does not cover this. A tiny safe wrapper
# (libc only, already in the tree via `region`), so #![forbid(unsafe_code)]
# holds. Unix-only; a no-op elsewhere.
[target.'cfg(unix)'.dependencies]
rlimit = "0.10"
