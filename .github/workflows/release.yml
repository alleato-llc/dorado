name: Release

# The Rust CLI release track — for now the only port shipping prebuilt
# binaries (dorado is versioned per component; see VERSIONS.md). salpa
# (github.com/alleato-llc/salpa, a private house release tool pulled from
# ghcr) owns version -> test -> build -> publish. rust/salpa.yaml drives
# `test`/`version` (shared); `build`/`publish` instead run TWICE per platform
# leg, once against rust/salpa-dorado.yaml and once against
# rust/salpa-gyotaku.yaml (`salpa --config <file>`), each producing one bare
# per-platform binary (dorado-<os>-<arch>[.exe], gyotaku-<os>-<arch>[.exe]) —
# no archive, so each CLI downloads as a single file. `salpa version`
# computes the next semver from rust-v* tags + commit keywords (patch by
# default; #minor/#major in the head commit bumps bigger); every artifact
# lands on the same rust-v<version> GitHub release, the point of truth for
# downloads.
#
# The two GUI apps (dorado-gui, gyotaku-gui) ship on this SAME rust-v* track
# (see `build-gui-macos` / `build-gui-portable` below), each driven by its own
# plain salpa.yaml living in its own crate directory (rust/crates/dorado-gui/,
# rust/crates/dorado-gyotaku-gui/ -- both excluded from the main Cargo
# workspace over their `rime` path dependency, see rust/Cargo.toml). Unlike
# the CLI, macOS gets a SIGNED + NOTARIZED universal dmg (Gatekeeper is far
# more hostile to a double-clicked, unsigned GUI app than a terminal-launched
# CLI binary); Linux/Windows still get bare unsigned binaries, same as the
# CLI. Signing needs a one-time secrets setup -- see rust/docs/RELEASING.md.
#
# Auto-releases on every push to main touching rust/** — no manual tag push.
# Other ports can grow their own `<port>-v*` track here later.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - ".github/workflows/release.yml"

permissions:
  contents: write # create the release + upload the binaries
  packages: read # pull salpa from ghcr

concurrency:
  group: dorado-release-rust
  cancel-in-progress: false

env:
  SALPA_VERSION: "0.1.12" # pinned salpa release on ghcr (bump deliberately)

jobs:
  # Correctness gate before anything is versioned/released.
  test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: oras-project/setup-oras@v1
      - name: salpa test
        run: |
          echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras pull "ghcr.io/${{ github.repository_owner }}/salpa:${SALPA_VERSION}"
          chmod +x salpa-linux-amd64
          cd rust && "$GITHUB_WORKSPACE/salpa-linux-amd64" test

  # Compute the next rust-v* version and create the empty GitHub release once,
  # so the parallel build legs deterministically upload into it (no create race).
  version:
    name: Version + create release
    needs: [test]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # rust-v* tags drive the version
      - uses: oras-project/setup-oras@v1
      - name: Compute version + init release
        id: v
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras pull "ghcr.io/${{ github.repository_owner }}/salpa:${SALPA_VERSION}"
          chmod +x salpa-linux-amd64
          VERSION=$(cd rust && "$GITHUB_WORKSPACE/salpa-linux-amd64" version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Rust release: rust-v$VERSION"
          # Idempotent empty release (already exists on a re-run -> skip).
          if ! gh release view "rust-v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "rust-v$VERSION" \
              --repo "${{ github.repository }}" \
              --target "$GITHUB_SHA" \
              --title "dorado (Rust) $VERSION" \
              --generate-notes
          fi
          # LICENSE is platform-independent (unlike the per-leg binaries below), so
          # it's attached once here rather than duplicated across the 4 build legs.
          # --clobber makes this idempotent on a re-run.
          gh release upload "rust-v$VERSION" LICENSE --repo "${{ github.repository }}" --clobber

  # No signing here (unlike soroban's macOS track), so all 4 legs are plain,
  # unsigned bare-binary builds — one job, no per-secret job split needed. Each
  # leg runs salpa twice (once per --config) to produce both CLIs' binaries.
  #
  # macos-x86_64 uses macos-15-intel, not bare macos-13: GitHub retired macos-13
  # as a hosted runner label (macos-latest/macos-14/macos-15 are arm64-only now),
  # so an Intel Mac leg needs the explicit -intel suffix. Same standard per-minute
  # billing rate as the arm64 runners, no org-level "larger runner" opt-in needed
  # (that's the separate -large/-xlarge SKU).
  build:
    name: ${{ matrix.name }}
    needs: [version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, salpa: salpa-linux-amd64 }
          - { name: macos-arm64, os: macos-latest, salpa: salpa-darwin-arm64 }
          - { name: macos-x86_64, os: macos-15-intel, salpa: salpa-darwin-amd64 }
          - { name: windows-x86_64, os: windows-latest, salpa: salpa-windows-amd64.exe }
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: release-${{ matrix.name }}
      - uses: oras-project/setup-oras@v1
      - name: salpa build + publish (dorado, gyotaku)
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras pull "ghcr.io/${{ github.repository_owner }}/salpa:${SALPA_VERSION}"
          SALPA="$PWD/${{ matrix.salpa }}"; chmod +x "$SALPA" || true
          cd rust
          for cfg in salpa-dorado.yaml salpa-gyotaku.yaml; do
            "$SALPA" --config "$cfg" --version "${{ needs.version.outputs.version }}" build
            "$SALPA" --config "$cfg" --version "${{ needs.version.outputs.version }}" publish
          done

  # GUI: macOS leg (its own job so the Apple signing secrets are scoped HERE
  # and nowhere else). A universal build needs BOTH Rust targets on one
  # runner (salpa lipo-fuses them), unlike the CLI's two separate per-arch
  # legs above -- that split doesn't apply once signing is involved, since
  # Gatekeeper/notarization want one universal binary per app. salpa
  # hand-bundles the release binary into a .app (icon from packaging/
  # AppIcon.icns), hardened-runtime codesigns it, packages a dmg, then
  # notarizes + staples. See rust/docs/RELEASING.md for the one-time secrets
  # setup this needs.
  #
  # dorado-gui and dorado-gyotaku-gui are excluded from the main Cargo
  # workspace (see rust/Cargo.toml) since each depends on the sibling `rime`
  # repo by path, so dorado and rime are checked out as siblings here too,
  # matching ci.yml's `gui` job and screenshots.yml.
  build-gui-macos:
    name: gui-macos-universal
    needs: [version]
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { path: dorado }
      - uses: actions/checkout@v4
        with: { repository: alleato-llc/rime, path: rime } # public sibling; dorado-gui/dorado-gyotaku-gui depend on it by ../../../../rime/rime
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin # universal lipo
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            dorado/rust/crates/dorado-gui
            dorado/rust/crates/dorado-gyotaku-gui
          key: release-gui-macos
      - uses: oras-project/setup-oras@v1
      - name: salpa build + publish (signed, notarized)
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras pull "ghcr.io/${{ github.repository_owner }}/salpa:${SALPA_VERSION}"
          SALPA="$PWD/salpa-darwin-arm64"; chmod +x "$SALPA"
          for app in dorado-gui dorado-gyotaku-gui; do
            # salpa's cert-import step creates a fixed-name keychain and does not
            # remove a stale one, so the second app in this loop otherwise dies on
            # `security create-keychain` (exit 48, "keychain already exists").
            # Drop any keychain left by the previous iteration first.
            security delete-keychain "${RUNNER_TEMP}/salpa-signing.keychain-db" 2>/dev/null || true
            (cd "dorado/rust/crates/$app" &&
              "$SALPA" --version "${{ needs.version.outputs.version }}" build &&
              "$SALPA" --version "${{ needs.version.outputs.version }}" publish)
          done

  # GUI: portable Linux/Windows binaries (bare, unsigned, matching the CLI's
  # own unsigned binaries on these platforms). Same platform scope as the
  # CLI's build matrix above (no arm64 legs). Needs the same windowing system
  # libraries ci.yml's `gui` job installs, since these are graphics-stack apps
  # even to compile, not just run.
  build-gui-portable:
    name: gui-${{ matrix.name }}
    needs: [version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, salpa: salpa-linux-amd64 }
          - { name: windows-x86_64, os: windows-latest, salpa: salpa-windows-amd64.exe }
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { path: dorado }
      - uses: actions/checkout@v4
        with: { repository: alleato-llc/rime, path: rime } # public sibling; dorado-gui/dorado-gyotaku-gui depend on it by ../../../../rime/rime
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            dorado/rust/crates/dorado-gui
            dorado/rust/crates/dorado-gyotaku-gui
          key: release-gui-${{ matrix.name }}
      - name: Linux windowing deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - uses: oras-project/setup-oras@v1
      - name: salpa build + publish (bare binaries)
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras pull "ghcr.io/${{ github.repository_owner }}/salpa:${SALPA_VERSION}"
          SALPA="$PWD/${{ matrix.salpa }}"; chmod +x "$SALPA" || true
          for app in dorado-gui dorado-gyotaku-gui; do
            (cd "dorado/rust/crates/$app" &&
              "$SALPA" --version "${{ needs.version.outputs.version }}" build &&
              "$SALPA" --version "${{ needs.version.outputs.version }}" publish)
          done
