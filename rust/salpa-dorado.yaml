# Build/publish config for the `dorado` CLI binary only — see rust/salpa.yaml
# for the shared test/version config and why this is split from gyotaku.
#
# No `package:` key -> salpa ships a bare per-platform binary
# (dorado-<os>-<arch>[.exe]), unsigned like every CLI in this repo. Same
# rust-v* release as salpa-gyotaku.yaml; release.yml runs both configs against
# every platform leg and publishes into the one release the `version` job
# already created.
ecosystem: rust
product: dorado
tag_prefix: rust-v

build:
  bin: dorado

publish:
  github: true
