[package]
name = "dorado-gyotaku-gui"
description = "Graphical frontend for gyotaku, the Skein-512 hashing tool (educational, unaudited)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gyotaku-gui"
path = "src/main.rs"

[dependencies]
dorado = { path = "../dorado" }
# The tokio executor enables timer subscriptions (the progress animation).
iced = { version = "0.12", features = ["tokio"] }
