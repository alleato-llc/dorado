<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<!--
  Copied from Gota (https://github.com/alleato-llc/gota); change it there and re-copy.
  Gota report template. report.py substitutes three things into this file and writes a
  finished, self-contained report.html: the report title, the embedded results.json
  (a JS object literal, or null for an empty viewer), and the generation date. The
  placeholder tokens are intentionally not written out here, so the substitution does
  not pollute this comment. Everything else is static; edit this file to restyle the
  report, and the script does not need to change.
-->
<style>
  :root {
    color-scheme: light dark;
    --accent: #6366f1;
    --accent2: #06b6d4;
    --accent-strong: #4338ca;
    --bg: #f6f7fb;
    --card: #ffffff;
    --border: #e6e6ef;
    --text: #1a1a22;
    --muted: #6b7280;
    --header-grad: linear-gradient(135deg, #6366f1, #06b6d4);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent-strong: #a5b4fc;
      --bg: #14151a;
      --card: #1d1f27;
      --border: #2b2e3a;
      --text: #e9e9f0;
      --muted: #9aa3b2;
      --header-grad: linear-gradient(135deg, #4f46e5, #0891b2);
    }
  }
  * { box-sizing: border-box; }
  body {
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0; padding: 2rem 1.25rem; max-width: 62rem; margin-inline: auto;
    color: var(--text); background: var(--bg);
  }
  h1 {
    font-size: 1.6rem; margin: 0 0 .35rem; letter-spacing: -0.01em;
    background: var(--header-grad); -webkit-background-clip: text;
    background-clip: text; color: transparent; display: inline-block;
  }
  .muted { color: var(--muted); font-size: .9rem; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 1rem 1.25rem; margin: 1.25rem 0;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(40,40,90,.04);
  }
  .controls { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
  input[type=file] { font: inherit; }
  input[type=file]::file-selector-button {
    font: inherit; border: 0; border-radius: 8px; padding: .4rem .8rem; cursor: pointer;
    color: #fff; background: var(--header-grad); margin-right: .6rem;
  }
  table { border-collapse: separate; border-spacing: 0; width: 100%; }
  th, td { padding: .55rem .8rem; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  thead th {
    background: var(--header-grad); color: #fff; cursor: pointer; user-select: none;
    position: sticky; top: 0; font-weight: 600;
  }
  thead th:first-child { border-top-left-radius: 10px; }
  thead th:last-child { border-top-right-radius: 10px; }
  thead th:hover { filter: brightness(1.06); }
  th .arrow { opacity: .55; font-size: .8em; margin-left: .25rem; }
  th.sorted .arrow { opacity: 1; }
  tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--card) 92%, var(--accent)); }
  tbody tr:hover td { background: color-mix(in srgb, var(--card) 84%, var(--accent)); }
  td { border-bottom: 1px solid var(--border); }
  .pill {
    display: inline-block; padding: .12rem .6rem; border-radius: 999px;
    font-weight: 600; font-size: .85rem; color: #fff;
  }
  .cell { position: relative; display: flex; justify-content: flex-end; align-items: center; min-width: 130px; }
  .bar {
    position: absolute; left: 0; top: 3px; bottom: 3px; border-radius: 5px;
    background: var(--row, var(--accent)); opacity: .20;
  }
  .val { position: relative; z-index: 1; font-variant-numeric: tabular-nums; }
  td.best .bar { opacity: .42; }
  td.best .val { font-weight: 700; }
  td.best .val::after { content: " ★"; color: var(--accent-strong); font-size: .8em; }
  .meta-grid { display: grid; grid-template-columns: auto 1fr; gap: .2rem 1rem; font-size: .9rem; }
  .meta-grid dt { color: var(--muted); }
  .meta-grid dd { margin: 0; }
  code { background: color-mix(in srgb, var(--card) 70%, var(--accent)); border-radius: 5px; padding: .05rem .35rem; }
  .legend { display: flex; gap: .5rem 1rem; flex-wrap: wrap; align-items: center; margin-top: .6rem; }
  .legend .pill { font-size: .8rem; }
  footer { margin-top: 1.5rem; }
</style>
</head>
<body>
  <h1 id="title">__TITLE__</h1>
  <div class="muted" id="subtitle"></div>

  <div class="card">
    <div class="controls">
      <label><strong>Load results.json:</strong> <input type="file" id="file" accept=".json,application/json"></label>
      <span class="muted" id="status"></span>
    </div>
  </div>

  <div id="report"></div>

  <footer class="muted">
    Generated by <code>gota/report.py</code> on __GENERATED__. Bars show each value
    relative to the fastest in its column; ★ marks the best. Numbers are peak of
    batches; higher is better. The page only shows what the loaded results.json holds.
  </footer>

<script>
const EMBEDDED = __DATA__;

// A small, distinct, colorblind-friendly-ish palette assigned per implementation.
const PALETTE = ["#6366f1", "#06b6d4", "#10b981", "#f59e0b", "#f43f5e", "#8b5cf6", "#14b8a6", "#f97316", "#0ea5e9", "#84cc16"];

const fmt = (n, unit) =>
  n.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 }) +
  (unit ? " " + unit : "");

function pivot(doc) {
  const rows = doc.results || [];
  const impls = [], benches = [];
  const by = {};
  for (const r of rows) {
    if (!impls.includes(r.impl)) impls.push(r.impl);
    if (!benches.includes(r.bench)) benches.push(r.bench);
    (by[r.impl] = by[r.impl] || {})[r.bench] = r.mbps;
  }
  return { impls, benches, by };
}

let state = null;

function render(doc) {
  const status = document.getElementById("status");
  if (!doc || !(doc.results || []).length) {
    document.getElementById("report").innerHTML =
      '<div class="card muted">No data loaded. Choose a results.json above.</div>';
    document.getElementById("subtitle").textContent = "";
    status.textContent = "";
    return;
  }
  const { impls, benches, by } = pivot(doc);
  const unit = (doc.units || "").split(/\s+/)[0] || "";
  const color = {};
  impls.forEach((i, k) => color[i] = PALETTE[k % PALETTE.length]);
  state = { impls, benches, by, unit, color, sortBench: null, asc: false };

  const bits = [];
  if (doc.machine) bits.push(doc.machine);
  if (doc.os) bits.push(doc.os);
  if (doc.date) bits.push(doc.date);
  if (doc.git_commit && doc.git_commit !== "unknown") bits.push("commit " + doc.git_commit);
  document.getElementById("subtitle").textContent = bits.join("  ·  ");
  status.textContent = impls.length + " implementations, " + benches.length + " benchmarks";

  const p = doc.params || {};
  const paramRows = Object.keys(p).map(k => `<dt>${k}</dt><dd><code>${p[k]}</code></dd>`).join("");
  const legend = impls.map(i =>
    `<span class="pill" style="background:${color[i]}">${i}</span>`).join("");
  const metaCard = `<div class="card"><div class="meta-grid">
    ${paramRows}${doc.units ? `<dt>units</dt><dd>${doc.units}</dd>` : ""}
  </div><div class="legend">${legend}</div></div>`;

  document.getElementById("report").innerHTML = metaCard + '<div class="card" id="tablecard"></div>';
  drawTable();
}

function drawTable() {
  const { impls, benches, by, unit, color, sortBench, asc } = state;

  const best = {};
  for (const b of benches) {
    best[b] = Math.max(...impls.map(i => (by[i] || {})[b]).filter(v => v != null));
  }

  let order = impls.slice();
  if (sortBench === "__impl__") {
    order.sort((x, y) => asc ? x.localeCompare(y) : y.localeCompare(x));
  } else if (sortBench !== null) {
    order.sort((x, y) => {
      const a = (by[x] || {})[sortBench] ?? -Infinity, b = (by[y] || {})[sortBench] ?? -Infinity;
      return asc ? a - b : b - a;
    });
  }

  const arrow = key => `<span class="arrow">${sortBench === key && asc ? "▲" : "▼"}</span>`;

  let html = "<table><thead><tr>";
  html += `<th data-key="__impl__" class="${sortBench === "__impl__" ? "sorted" : ""}">Implementation ${arrow("__impl__")}</th>`;
  for (const b of benches) {
    html += `<th data-key="${b}" class="${sortBench === b ? "sorted" : ""}">${b} ${arrow(b)}</th>`;
  }
  html += "</tr></thead><tbody>";
  for (const i of order) {
    html += `<tr style="--row:${color[i]}"><td><span class="pill" style="background:${color[i]}">${i}</span></td>`;
    for (const b of benches) {
      const v = (by[i] || {})[b];
      if (v == null) { html += `<td class="num">—</td>`; continue; }
      const p = best[b] > 0 ? Math.max(2, (v / best[b]) * 100) : 0;
      const cls = "num" + (v === best[b] ? " best" : "");
      html += `<td class="${cls}"><div class="cell"><div class="bar" style="width:${p}%"></div><span class="val">${fmt(v, unit)}</span></div></td>`;
    }
    html += "</tr>";
  }
  html += "</tbody></table>";
  document.getElementById("tablecard").innerHTML = html;

  document.querySelectorAll("th[data-key]").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.key;
      if (state.sortBench === key) state.asc = !state.asc;
      else { state.sortBench = key; state.asc = false; }
      drawTable();
    });
  });
}

document.getElementById("file").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try { render(JSON.parse(reader.result)); }
    catch (err) { document.getElementById("status").textContent = "Could not parse: " + err.message; }
  };
  reader.readAsText(f);
});

render(EMBEDDED);
</script>
</body>
</html>
