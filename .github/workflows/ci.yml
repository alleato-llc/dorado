name: CI

on:
  push:
  pull_request:

jobs:
  # Detect which components changed, so each job below runs only when relevant. A
  # change to the wire-format spec (docs/spec.md) or to this workflow re-runs the
  # cross-compat suites everywhere, preserving the byte-for-byte invariant across
  # ports. Pure docs/changelog changes match nothing and run no build jobs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      go: ${{ steps.filter.outputs.go }}
      java: ${{ steps.filter.outputs.java }}
      python: ${{ steps.filter.outputs.python }}
      c: ${{ steps.filter.outputs.c }}
      zig: ${{ steps.filter.outputs.zig }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            spec: &spec
              - 'docs/spec.md'
              - '.github/workflows/ci.yml'
            rust:
              - *spec
              - 'rust/**'
            go:
              - *spec
              - 'go/**'
            java:
              - *spec
              - 'java/**'
            python:
              - *spec
              - 'python/**'
            c:
              - *spec
              - 'c/**'
            zig:
              - *spec
              - 'zig/**'
            web:
              - '.github/workflows/ci.yml'
              - 'web/**'

  # Format, lint, and test the cipher and construction crates plus the CLIs.
  # These need no system libraries. The Rust workspace lives in rust/.
  core:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude dorado-gui --exclude dorado-gyotaku-gui --all-targets -- -D warnings
      - run: cargo test --workspace --exclude dorado-gui --exclude dorado-gyotaku-gui
      # Exercise the optional RustCrypto trait impls (cipher + digest).
      - run: cargo test -p dorado --all-features
      # Make sure the benchmarks keep compiling (do not run them in CI).
      - run: cargo bench -p dorado --no-run

  # The GUIs pull in a graphics stack and need windowing system libraries to
  # build, so they get their own job with those installed (build/lint only).
  gui:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - run: cargo clippy -p dorado-gui --all-targets -- -D warnings
      - run: cargo clippy -p dorado-gyotaku-gui --all-targets -- -D warnings

  # Prove the cipher library builds without std on a bare-metal target, at both
  # levels: with an allocator (default) and fully allocation-free
  # (--no-default-features). If anything leaks std, or alloc into the no-alloc
  # build, these fail to compile.
  nostd:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - run: cargo build -p dorado --target thumbv7em-none-eabi
      - run: cargo build -p dorado --no-default-features --target thumbv7em-none-eabi

  # Check dependencies against the RustSec advisory database.
  audit:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: rust

  # Vet, build, and test the Go port (which must match the Rust on-disk format).
  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Build and test the Java SDK (which must match the Rust on-disk format). Its
  # cross-compat tests decrypt fixtures made by the Rust CLI, committed in the repo.
  java:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew test --no-daemon

  # Test the Python port (SDK + CLIs). Cross-compat tests decrypt fixtures made by
  # the Rust CLI, committed in the repo.
  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # Build and test the C port (SDK + CLIs). Argon2 from libargon2, scrypt/PBKDF2/
  # HMAC from OpenSSL, both via pkg-config. Cross-compat tests decrypt fixtures
  # made by the Rust CLI, committed in the repo.
  c:
    needs: changes
    if: needs.changes.outputs.c == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: c
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libargon2-dev libssl-dev pkg-config
      - run: make
      - run: make test
      - run: make test SAN=1     # rerun the suite under AddressSanitizer + UndefinedBehaviorSanitizer
      - run: make freestanding   # the primitives build with no OS / allocator

  # Build and test the Zig port (SDK + CLIs). No external libraries: the KDFs come
  # from Zig's standard library. Cross-compat tests decrypt fixtures made by the
  # Rust CLI, committed in the repo.
  zig:
    needs: changes
    if: needs.changes.outputs.zig == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zig
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: "0.16.0"
      - run: zig build
      - run: zig build test
      - run: zig build freestanding   # the primitives cross-compile to bare-metal ARM

  # Build the landing page in web/ so a broken site fails CI.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
