name: Deploy site

# The landing page in web/ deploys to the static host (dorado.alleato.dev) on
# every push to main that TOUCHES web/. If nothing under web/ changed, the path
# filter means this workflow never starts: no build, no deploy, nothing. A new
# release on the rust-v* track also redeploys the site, so the build-time
# download-link resolution (web/src/lib/releases.ts) picks up the freshly
# published binaries.
#
# salpa (github.com/alleato-llc/salpa, a private house release tool pulled
# from ghcr) owns the deploy: `salpa deploy` builds web/ (npm) and syncs
# web/dist to the site host (S3 + CloudFront, provisioned separately as IaC),
# then busts the CDN cache — see salpa.yaml at the repo root. No raw aws-cli
# in this file; salpa shells it internally, parameterized by salpa.yaml.
#
# Auth is short-lived OIDC credentials (the dorado-github-deploy-role), no
# stored keys. The CloudFront distribution is found at runtime by its alias
# (== the bucket/domain), so no distribution id needs wiring here.
#
# Required repository config (Settings -> Secrets and variables -> Actions):
#   AWS_REGION (variable)          region of the deploy role (us-east-1)
#   AWS_SITE_ROLE_ARN (secret)     arn of dorado-github-deploy-role (OIDC) — a
#     SECRET, not a variable: GitHub auto-redacts secrets everywhere in logs,
#     which a variable + a manual ::add-mask:: step does NOT do (the step's own
#     `env:` block still gets echoed in its log preamble before the mask takes
#     effect — that's a leak, not defense in depth; don't revert this to a
#     variable no matter how it's masked downstream).
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "salpa.yaml"
      - ".github/workflows/deploy-site.yml"
  # A new rust-v* release redeploys the site so web/src/lib/releases.ts picks up
  # the freshly published download links.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write # assume the deploy role via OIDC
  contents: read
  packages: read # pull salpa from ghcr

concurrency:
  group: deploy-site
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  SALPA_VERSION: "0.1.12" # pinned salpa release on ghcr (bump deliberately)

jobs:
  deploy:
    name: Deploy site (salpa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: oras-project/setup-oras@v1

      - name: Fetch salpa
        run: |
          echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras pull "ghcr.io/${{ github.repository_owner }}/salpa:${SALPA_VERSION}"
          chmod +x salpa-linux-amd64
          sudo mv salpa-linux-amd64 /usr/local/bin/salpa

      - name: Configure deploy credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_SITE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy
        # GITHUB_TOKEN authenticates web/src/lib/releases.ts's build-time call to
        # the Releases API — required (not just rate-limit relief), since this
        # repo is private and an unauthenticated request 404s regardless of rate
        # limit. The resolver never fails the build even without it; links just
        # degrade to the Releases page.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: salpa deploy # npm build web/ -> sync web/dist -> invalidate CloudFront
