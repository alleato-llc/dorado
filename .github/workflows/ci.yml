name: CI

on:
  push:
  pull_request:

jobs:
  # Format, lint, and test the cipher and construction crates plus the CLIs.
  # These need no system libraries. The Rust workspace lives in rust/.
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude dorado-gui --all-targets -- -D warnings
      - run: cargo test --workspace --exclude dorado-gui
      # Exercise the optional RustCrypto `cipher` trait impls too.
      - run: cargo test -p dorado --features cipher
      # Make sure the benchmarks keep compiling (do not run them in CI).
      - run: cargo bench -p dorado --no-run

  # The GUI pulls in a graphics stack and needs windowing system libraries to
  # build, so it gets its own job with those installed (build/lint only).
  gui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - run: cargo clippy -p dorado-gui --all-targets -- -D warnings

  # Prove the cipher library builds without std on a bare-metal target, at both
  # levels: with an allocator (default) and fully allocation-free
  # (--no-default-features). If anything leaks std, or alloc into the no-alloc
  # build, these fail to compile.
  nostd:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - run: cargo build -p dorado --target thumbv7em-none-eabi
      - run: cargo build -p dorado --no-default-features --target thumbv7em-none-eabi

  # Check dependencies against the RustSec advisory database.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: rust

  # Build the landing page in web/ so a broken site fails CI.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
